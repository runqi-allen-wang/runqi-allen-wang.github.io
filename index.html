<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="site-description" name="description" content="A configurable academic homepage." />
    <meta id="site-author" name="author" content="Runqi Wang" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#3155d9" />
    <title>Academic homepage</title>

    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
            } catch (error) {
                document.documentElement.dataset.theme = 'light';
            }
        }());
    </script>

    <link rel="icon" type="image/svg+xml" href="static/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="static/css/styles.css" rel="stylesheet" />
    <link href="static/css/main.css" rel="stylesheet" />

    <script src="static/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/marked.min.js"></script>
    <script src="static/js/js-yaml.min.js"></script>

    <script>
        MathJax = {
            tex: {
                packages: {},
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: false,
                processEnvironments: true,
                processRefs: true,
                tags: 'all',
                tagSide: 'right',
                tagIndent: '0.8em',
                useLabelIds: true,
                maxMacros: 10000,
                maxBuffer: 5 * 1024
            }
        };
    </script>
    <script id="MathJax-script" async src="static/js/tex-svg.js"></script>
    <script src="static/js/scripts.js"></script>
</head>

<body id="page-top">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <nav class="header navbar navbar-expand-lg navbar-light fixed-top" id="mainNav" aria-label="Primary navigation">
        <div class="container px-4 px-lg-5">
            <a id="page-top-title" class="navbar-brand" href="#page-top">Academic homepage</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Open navigation">
                <span>Menu</span>
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <div id="navigation-links" class="navbar-nav ms-auto align-items-lg-center"></div>
                <div class="navbar-nav nav-utilities align-items-lg-center">
                    <a id="cv-link" class="nav-link nav-cv" href="static/assets/CV.pdf" target="_blank" rel="noopener noreferrer">
                        <i class="bi bi-file-earmark-person" aria-hidden="true"></i>
                        <span>CV</span>
                    </a>
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color mode">
                        <i id="theme-toggle-icon" class="bi bi-moon-stars" aria-hidden="true"></i>
                        <span id="theme-toggle-text">Dark</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header id="hero" class="top-section">
        <div class="top-section-content container px-4 px-lg-5">
            <h1 id="top-section-bg-text">About me</h1>
        </div>
    </header>

    <div class="profile-shell container px-4 px-lg-5" aria-label="Profile portrait">
        <div id="avatar">
            <img id="profile-image" src="static/assets/img/photo.jpg" alt="Portrait of Runqi Wang" />
        </div>
    </div>

    <main id="main-content">
        <div id="sections-root"></div>
        <noscript>
            <section class="content-section">
                <div class="container px-4 px-lg-5">
                    <p>This site needs JavaScript to load its Markdown content.</p>
                </div>
            </section>
        </noscript>
    </main>

    <footer class="site-footer">
        <div class="container px-4 px-lg-5">
            <p id="copyright-text"></p>
            <div class="footer-links" aria-label="Repository links">
                <a id="github-link" href="https://github.com/runqi-allen-wang/runqi-allen-wang.github.io">Source</a>
                <a id="license-link" href="LICENSE">License</a>
                <a id="upstream-link" href="https://github.com/senli1073/academic-homepage-template" target="_blank" rel="noopener noreferrer">Original template by Sen Li</a>
            </div>
            <p class="footer-credit">A derivative of <a href="https://github.com/senli1073/academic-homepage-template" target="_blank" rel="noopener noreferrer">Academic Homepage Template</a>, used under the MIT License.</p>
        </div>
    </footer>
</body>

</html>
